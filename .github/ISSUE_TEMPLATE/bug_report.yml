name: Bug report
description: Report a CMS defect for release triage.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - S0 outage or security
        - S1 core flow broken
        - S2 degraded workflow
        - S3 polish
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - admin
        - api
        - database
        - auth
        - media
        - public
        - deployment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Go to...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release SHA or version
      placeholder: dffd676 or v0.1.0
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: local, staging, production
